[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-sift-fingerprint"
version = "0.1.0"
description = "Fingerprint feature extraction project based on OpenCV SIFT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "PyYAML",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
